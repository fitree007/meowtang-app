name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, 'claude/**' ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.6'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Name APK with version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //; s/+.*//')
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          mkdir -p dist_apk
          cp build/app/outputs/flutter-apk/app-release.apk "dist_apk/MeowTang-v${VERSION}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeowTang-Android-APK
          path: dist_apk/*.apk

      # A release gives a plain download link that works from a phone browser.
      - name: Publish APK as a GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}-build${{ github.run_number }}
          name: MeowTang v${{ env.VERSION }} (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          body: |
            Test build from `${{ github.ref_name }}` (${{ github.sha }}).
            Signed with the debug key: for installing on a phone, not for Google Play.
          files: dist_apk/*.apk
          make_latest: true
