name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build-ipa:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS App without code signing
        run: flutter build ios --release --no-codesign --no-tree-shake-icons

      - name: Package into IPA (for Sideloading / ESign / Scarlet / AppleJr)
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r MeowTang-v1.41.2.ipa Payload
          mkdir -p dist_ipa
          mv MeowTang-v1.41.2.ipa dist_ipa/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeowTang-iOS-IPA
          path: dist_ipa/MeowTang-v1.41.2.ipa
